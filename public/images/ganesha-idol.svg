<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Aura Gradient -->
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Crown Gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Body Saffron Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Crimson Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Aura Background Circle -->
  <circle cx="100" cy="110" r="85" fill="url(#auraGrad)"/>
  <circle cx="100" cy="110" r="75" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Lord Ganesha Body / Shoulders -->
  <path d="M 45 170 C 45 140, 65 130, 100 130 C 135 130, 155 140, 155 170 C 155 195, 140 215, 100 215 C 60 215, 45 195, 45 170 Z" fill="url(#bodyGrad)" stroke="#7c2d12" stroke-width="2"/>

  <!-- Dhoti & Shawl Detail -->
  <path d="M 50 160 Q 100 185 150 160 Q 100 220 50 160 Z" fill="url(#crimsonGrad)" opacity="0.8"/>

  <!-- Left Ear -->
  <path d="M 62 85 C 30 80, 25 110, 58 125 C 68 120, 70 100, 62 85 Z" fill="url(#bodyGrad)" stroke="#7c2d12" stroke-width="2"/>
  <path d="M 58 92 C 38 88, 35 105, 56 116 Z" fill="#fdba74" opacity="0.5"/>

  <!-- Right Ear -->
  <path d="M 138 85 C 170 80, 175 110, 142 125 C 132 120, 130 100, 138 85 Z" fill="url(#bodyGrad)" stroke="#7c2d12" stroke-width="2"/>
  <path d="M 142 92 C 162 88, 165 105, 144 116 Z" fill="#fdba74" opacity="0.5"/>

  <!-- Ganesha Head Base -->
  <ellipse cx="100" cy="105" rx="36" ry="32" fill="url(#bodyGrad)" stroke="#7c2d12" stroke-width="2"/>

  <!-- Elephant Ears Ornate Border -->
  <circle cx="48" cy="102" r="3" fill="#f59e0b"/>
  <circle cx="152" cy="102" r="3" fill="#f59e0b"/>

  <!-- Crown (Mukut) Base -->
  <path d="M 68 85 L 132 85 L 125 45 L 100 15 L 75 45 Z" fill="url(#crownGrad)" stroke="#78350f" stroke-width="2"/>
  <path d="M 75 85 L 125 85 L 120 55 L 100 30 L 80 55 Z" fill="#fef08a" opacity="0.4"/>

  <!-- Crown Jewels & Circles -->
  <circle cx="100" cy="35" r="5" fill="#dc2626"/>
  <circle cx="100" cy="55" r="7" fill="#dc2626" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="85" cy="65" r="4" fill="#16a34a"/>
  <circle cx="115" cy="65" r="4" fill="#16a34a"/>

  <!-- Crown Top Kalash Symbol -->
  <path d="M 96 15 Q 100 5 104 15 Z" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
  <circle cx="100" cy="7" r="3" fill="#dc2626"/>

  <!-- Tilak on Forehead (Trishul & Chandrabindu) -->
  <path d="M 93 82 Q 100 78 107 82 L 104 94 Q 100 97 96 94 Z" fill="#dc2626"/>
  <line x1="100" y1="76" x2="100" y2="96" stroke="#fef08a" stroke-width="2"/>
  <circle cx="100" cy="75" r="2.5" fill="#fef08a"/>

  <!-- Eyes -->
  <!-- Left Eye -->
  <ellipse cx="84" cy="98" rx="6" ry="4" fill="#ffffff" stroke="#7c2d12" stroke-width="1"/>
  <circle cx="85" cy="98" r="2.5" fill="#451a03"/>
  <!-- Right Eye -->
  <ellipse cx="116" cy="98" rx="6" ry="4" fill="#ffffff" stroke="#7c2d12" stroke-width="1"/>
  <circle cx="115" cy="98" r="2.5" fill="#451a03"/>

  <!-- Eyebrows -->
  <path d="M 77 92 Q 84 89 90 93" fill="none" stroke="#7c2d12" stroke-width="2"/>
  <path d="M 123 92 Q 116 89 110 93" fill="none" stroke="#7c2d12" stroke-width="2"/>

  <!-- Tusk (Dant) - Broken Tusk on Right -->
  <path d="M 88 112 L 82 120 L 86 122 L 90 114 Z" fill="#ffffff" stroke="#7c2d12" stroke-width="1"/>
  <path d="M 112 112 L 116 116 L 114 118 L 110 114 Z" fill="#ffffff" stroke="#7c2d12" stroke-width="1"/>

  <!-- Trunk (Sond) curving gracefully to the left holding Modak -->
  <path d="M 94 106 Q 100 115 102 128 Q 104 145 92 150 Q 75 155 70 142 Q 68 132 78 132 Q 85 132 82 140" fill="none" stroke="url(#bodyGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 94 106 Q 100 115 102 128 Q 104 145 92 150 Q 75 155 70 142 Q 68 132 78 132 Q 85 132 82 140" fill="none" stroke="#7c2d12" stroke-width="14" stroke-linecap="round" opacity="0.15"/>

  <!-- Trunk Lines / Decoration -->
  <path d="M 95 115 Q 100 120 102 125" fill="none" stroke="#fef08a" stroke-width="2"/>
  <path d="M 94 122 Q 99 127 101 132" fill="none" stroke="#fef08a" stroke-width="2"/>

  <!-- Modak in Trunk / Hand -->
  <path d="M 74 136 Q 78 126 82 136 Q 80 142 76 142 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>

  <!-- Blessing Hand (Abhaya Mudra) on Right -->
  <g transform="translate(135, 135)">
    <path d="M 0 15 C 8 5, 20 5, 22 20 C 22 28, 10 35, 0 30 Z" fill="url(#bodyGrad)" stroke="#7c2d12" stroke-width="1.5"/>
    <!-- Sacred Om Symbol in Palm -->
    <text x="5" y="23" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">ॐ</text>
  </g>

  <!-- Base Lotus / Platform -->
  <path d="M 30 205 Q 100 235 170 205 Q 150 230 100 232 Q 50 230 30 205 Z" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/>
  <path d="M 45 200 Q 100 220 155 200 Q 140 222 100 224 Q 60 222 45 200 Z" fill="#fb7185"/>

</svg>
